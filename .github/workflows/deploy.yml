name: Deploy to Lightsail

on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/softbase-tech/bondzi-backend:latest
            ghcr.io/softbase-tech/bondzi-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/bondzi

            # Login to GHCR so the docker pull below succeeds.
            echo "${{ secrets.GHCR_TOKEN }}" \
              | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the fresh api + worker images. Postgres / Redis / Nginx
            # stay on their existing tags (they only change in dedicated
            # maintenance windows).
            docker compose pull api worker

            # Apply any new migrations in a one-shot container before
            # we hot-swap the api. If migration:run exits non-zero the
            # whole deploy aborts here — no half-migrated state.
            docker compose run --rm api npm run migration:run

            # Rolling api swap. --no-deps so postgres/redis aren't touched.
            docker compose up -d --no-deps api
            sleep 5
            curl -fsS http://localhost:3000/health \
              | grep -q '"status":"ok"' \
              || { echo "Health check failed after api swap"; exit 1; }

            # Worker swap after api proves healthy — preserves the
            # invariant that a healthy api is always running.
            docker compose up -d --no-deps worker

            # Reclaim disk; keep yesterday's images for quick rollback.
            docker image prune -f --filter "until=24h"

      - name: Notify on success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\":white_check_mark: Bondzi deploy succeeded: ${{ github.sha }}\"}" \
            $SLACK_WEBHOOK_URL || true

      - name: Notify on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\":x: Bondzi deploy FAILED: ${{ github.sha }}\"}" \
            $SLACK_WEBHOOK_URL || true
