name: Test

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: bondzi
          POSTGRES_PASSWORD: bondzi_test
          POSTGRES_DB: bondzi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bondzi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://bondzi:bondzi_test@localhost:5432/bondzi_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test_access_secret_not_for_production
      JWT_REFRESH_SECRET: test_refresh_secret_not_for_production
      AWS_REGION: eu-central-1
      # Bedrock isn't called in unit tests, but if any path reaches the SDK
      # the env vars need to exist so the SDK doesn't error out on init.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - run: npm run migration:run

      - name: Unit tests
        run: npm test -- --maxWorkers=2 --passWithNoTests

      - name: e2e tests
        run: npm run test:e2e -- --runInBand --passWithNoTests
        if: hashFiles('test/jest-e2e.json') != ''

      - run: npm run build
