# Production compose for the Lightsail box.
# Drops into /opt/bondzi/docker-compose.yml. Pulls the api + worker images
# from GHCR (built by .github/workflows/deploy.yml on every push to deploy).
#
# Five containers, one box: postgres, redis, api, worker, nginx.
# Postgres / Redis data lives on host bind mounts so it survives container
# restarts and image swaps.

services:

  postgres:
    image: postgres:15-alpine
    container_name: bondzi-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bondzi-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis-data:/data
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/softbase-tech/bondzi-backend:latest
    container_name: bondzi-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Bound to loopback only — Nginx fronts every external request and
    # adds rate limits + the Paystack IP allowlist.
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      WORKER_MODE: "false"
    mem_limit: 640m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: ghcr.io/softbase-tech/bondzi-backend:latest
    container_name: bondzi-worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      WORKER_MODE: "true"
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: bondzi-nginx
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/bondzi.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    mem_limit: 64m
