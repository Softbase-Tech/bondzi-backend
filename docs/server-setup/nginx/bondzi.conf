# /opt/bondzi/nginx/bondzi.conf
#
# Mounted into the nginx container at /etc/nginx/conf.d/default.conf.
# Reload after edits:  docker exec bondzi-nginx nginx -s reload
#
# Layout:
#   - HTTP server: ACME challenge + 301 to HTTPS.
#   - HTTPS server: TLS, rate limits, Paystack-IP-allowlisted webhook,
#     loopback proxy to the api container.

# Rate-limit zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=otp_send:10m rate=1r/m;

# Paystack source IPs — refresh from their docs periodically
geo $paystack_ip {
    default 0;
    52.31.139.75    1;
    52.49.173.169   1;
    52.214.14.220   1;
}

# HTTP → HTTPS + ACME challenge for cert renewal
resolver 127.0.0.11 valid=10s ipv6=off;
server {
    listen 80;
    server_name api.bondzi.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name api.bondzi.online;

    ssl_certificate     /etc/letsencrypt/live/api.bondzi.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bondzi.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;
    client_max_body_size 8m;

    # Upstream — declared once, used in every location below.
    # Requires the top-level `resolver 127.0.0.11 valid=10s ipv6=off;`
    # so the hostname re-resolves every 10s instead of caching at startup.
    set $api_upstream http://api:3000;

    # === Paystack webhook ===
    # No body modification, optional IP allowlist
    location = /payments/webhook {
        if ($paystack_ip = 0) { return 403; }
	proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Paystack-Signature $http_x_paystack_signature;
        proxy_request_buffering on;
        proxy_buffering off;
    }

    # === Auth endpoints — tighter limits ===
    location = /auth/login {
        limit_req zone=auth_login burst=3 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Device-ID $http_x_device_id;
    }
    location = /auth/otp/send {
        limit_req zone=otp_send burst=2 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # === Health (no rate limit, no access log) ===
    location = /health {
        proxy_pass $api_upstream;
        access_log off;
    }

    # === Everything else ===
    location / {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Device-ID $http_x_device_id;
        proxy_read_timeout 60s;
    }
}
