# /opt/bondzi/nginx/bondzi.conf
#
# Mounted into the nginx container at /etc/nginx/conf.d/default.conf.
# Reload after edits:  docker exec bondzi-nginx nginx -s reload
#
# Layout:
#   - HTTP server: ACME challenge + 301 to HTTPS.
#   - HTTPS server: TLS, rate limits, Paystack-IP-allowlisted webhook,
#     loopback proxy to the api container.

# === Rate-limit zones ===
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_login:10m  rate=1r/s;
limit_req_zone $binary_remote_addr zone=otp_send:10m    rate=1r/m;

# === Paystack source IPs ===
# Refresh from https://paystack.com periodically — these can change.
geo $paystack_ip {
    default 0;
    52.31.139.75    1;
    52.49.173.169   1;
    52.214.14.220   1;
}


# === HTTP → HTTPS + ACME challenge ===
server {
    listen 80;
    server_name api.bondzi.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# === Main HTTPS server ===
server {
    listen 443 ssl http2;
    server_name api.bondzi.online;

    ssl_certificate     /etc/letsencrypt/live/api.bondzi.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bondzi.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Modern Mozilla cipher list — drops RC4 / 3DES / CBC-without-AEAD
    # that the prior `HIGH:!aNULL:!MD5` blob still happened to enable.
    # Leaves TLS 1.2 working for older clients (Android 7) without
    # leaving DES-CBC and friends on the table for downgrade attacks.
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;

    # Forward secrecy session params.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling — nginx fetches and caches the cert's revocation
    # status from Let's Encrypt's OCSP responder, then serves it
    # inline. Without this, every client does its own OCSP lookup
    # which (a) leaks the cert subject to the OCSP responder, (b)
    # silently fails when the responder is slow, (c) adds ~100ms to
    # cold connections. resolver: Cloudflare 1.1.1.1 + Google 8.8.8.8.
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/api.bondzi.online/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;
    # MUST match the Express body parser limit in src/main.ts. If nginx
    # is larger, callers see a confusing Express error after nginx
    # already accepted the body; if smaller, callers see a 413 from
    # nginx even though the api would have accepted it.
    client_max_body_size 4m;

    # === Paystack webhook ===
    # CRITICAL: do not mutate the request body — NestJS verifies HMAC over
    # the raw bytes. `proxy_request_buffering on` + `proxy_buffering off`
    # holds the body in memory then forwards as-is.
    location = /api/v1/payments/webhooks/paystack {
        if ($paystack_ip = 0) { return 403; }
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Paystack-Signature $http_x_paystack_signature;
        proxy_request_buffering on;
        proxy_buffering off;
    }

    # === Auth — tighter limits to choke off credential stuffing ===
    location = /api/v1/auth/login {
        limit_req zone=auth_login burst=3 nodelay;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Device-ID $http_x_device_id;
    }
    location = /api/v1/auth/otp/send {
        limit_req zone=otp_send burst=2 nodelay;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # === Health (no rate limit, no access log) ===
    location = /health {
        proxy_pass http://api:3000;
        access_log off;
    }

    # === Prometheus metrics — refused from the public internet ===
    # Grafana Cloud is a RECEIVER, not a scraper — there's no hosted
    # process reaching out to pull from us. Any future scraper
    # (Grafana Alloy added to docker-compose) lives on the same
    # bridge network and hits the api container DIRECTLY, never via
    # nginx. So this endpoint should not be reachable through the
    # public reverse proxy at all. Return 404 (not 403) so we don't
    # confirm the path exists to a scanner.
    location = /api/v1/internal/metrics {
        return 404;
    }

    # === Server-Sent Events — admin AI job progress streams ===
    # `/admin/explanations/jobs/:id/stream` (NestJS @Sse). Without the
    # buffering off + extended read timeout, nginx held every chunk
    # until it accumulated `proxy_buffer_size` bytes (default 4-8KB)
    # AND the connection would drop at proxy_read_timeout=60s. Result:
    # admins saw a frozen progress bar that suddenly jumped, then a
    # broken stream every minute.
    location ~ ^/api/v[0-9]+/admin/.*/stream$ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE essentials.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # 1h read timeout — long-running admin generation jobs send a
        # heartbeat every 2s, but background-tab handling + flaky
        # upstreams can leave gaps. 60s would cut every job before it
        # finished.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # === Everything else ===
    location / {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Device-ID $http_x_device_id;
        proxy_read_timeout 60s;
    }
}
