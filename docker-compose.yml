services:
  postgres:
    image: postgres:15-alpine
    container_name: bondzi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cloudWatcher
      POSTGRES_DB: pasco
    ports:
      - '5432:5432'
    volumes:
      - bondzi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'bondzi']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bondzi_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - bondzi_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bondzi_pg_data:
  bondzi_redis_data:
