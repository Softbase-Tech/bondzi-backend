services:
  postgres:
    image: postgres:15-alpine
    container_name: passmaster_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: passmaster
      POSTGRES_PASSWORD: passmaster
      POSTGRES_DB: passmaster
    ports:
      - "5432:5432"
    volumes:
      - passmaster_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "passmaster"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: passmaster_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - passmaster_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  passmaster_pg_data:
  passmaster_redis_data:
